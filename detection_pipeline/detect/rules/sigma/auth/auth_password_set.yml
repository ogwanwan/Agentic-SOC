# 계정 비밀번호가 설정·변경됨 (passwd, chpasswd, usermod -p).
# - 키 전용 EC2 에서 계정에 비밀번호가 생길 이유가 거의 없다. 백도어 계정에 비밀번호를 주거나
#   root 비밀번호를 바꿔 두는 것은 비밀번호 로그인·su 경로를 여는 준비 단계.
# - passwd/chpasswd 는 PAM(chauthtok) 줄로, usermod -p 는 shadow-utils 줄로 남고 둘 다 password_changed 로 정규화된다.
#   한 번의 변경이 두 줄을 동시에 남기는 경우가 있는지는 실로그로 확인 필요(있으면 히트 2건).
title: Account Password Set Or Changed
id: 824b9fe1-45b1-4927-9226-8954d6109219
status: experimental
description: passwd·chpasswd·usermod 로 계정 비밀번호가 설정되거나 바뀜
references:
  - https://attack.mitre.org/techniques/T1098/
author: 박지희
date: 2026-09-17
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: linux
  service: auth
detection:
  selection:
    layer_data.event: password_changed
  condition: selection
fields:
  - pid
  - layer_data.program
  - layer_data.user
  - layer_data.src_user
  - layer_data.pam_service
falsepositives:
  - 팀의 계획된 계정 비밀번호 설정
level: medium
x_correlation: recommended          # required(필수) | recommended(권장) | none(단독 판정)
x_correlation_note: '같은 계정(user)의 생성·그룹 추가·비밀번호 로그인과 묶어야 팀 작업과 구분'
x_seed_entity:
  - layer_data.user
  - pid