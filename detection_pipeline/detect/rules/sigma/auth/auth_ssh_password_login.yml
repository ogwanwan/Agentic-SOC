# 비밀번호 방식 SSH 로그인 성공.
# - EC2 Ubuntu 기본은 PasswordAuthentication no → 정상 운영에서는 Accepted publickey 만 나온다.
# - Accepted password|keyboard-interactive 가 나왔다면 누군가 sshd 설정을 바꿨고(→ auth_sudo_auth_config_change),
#   그 방식으로 로그인까지 성공했다는 뜻. 계정 탈취 후 지속 접근 경로를 만든 전형.
title: SSH Login With Password On Key-Only Server
id: dd10e7cd-9298-4b1a-b0a3-8187caba62e4
status: experimental
description: 키 전용 서버에서 비밀번호(또는 keyboard-interactive) 방식으로 SSH 로그인이 성공함
references:
  - https://attack.mitre.org/techniques/T1078/
  - https://attack.mitre.org/techniques/T1556/
author: 박지희
date: 2026-09-17
tags:
  - attack.initial-access
  - attack.persistence
  - attack.t1078
  - attack.t1556
logsource:
  product: linux
  service: auth
detection:
  selection_login:
    layer_data.event: ssh_accepted
  selection_method:
    layer_data.method|startswith:
      - password
      - keyboard-interactive
  condition: selection_login and selection_method
fields:
  - src_ip
  - pid
  - layer_data.user
  - layer_data.method
  - layer_data.rport
falsepositives:
  - 팀이 의도적으로 비밀번호 인증을 켠 경우 (그렇다면 이 룰을 끄지 말고 level 을 낮춘다)
level: high
x_correlation: none          # required(필수) | recommended(권장) | none(단독 판정)
x_correlation_note: '단독 판정 가능. 보강: 앞선 sshd 설정 변경(auth_sudo_auth_config_change), 같은 IP 의 실패 연결'
x_seed_entity:
  - src_ip