# root 가 아닌 계정에 UID 0(또는 GID 0·sudo 그룹 27)이 주어짐.
# - SigmaHQ lnx_privileged_user_creation 은 메시지 전문에서 'new user' + 'UID=0,' 등을 키워드로 찾는다.
#   같은 조건을 정규화 필드(uid·gid)로 옮기고, 기존 계정의 UID 를 0 으로 바꾸는 usermod -o -u 0 도 추가.
# - GID 10 은 RHEL wheel 이라 우분투(uucp)에서는 의미가 없어 뺐다.
title: Non-Root Account With UID 0 Or Root Group
id: c3f30016-9250-44e4-8aed-a75571a5adec
status: experimental
description: UID 0 이나 GID 0/27 로 계정이 생성되거나, 기존 계정의 UID 가 0 으로 바뀜. 숨은 root 계정
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/builtin/lnx_privileged_user_creation.yml
  - https://attack.mitre.org/techniques/T1136/001/
author: 박지희
date: 2026-09-17
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1136.001
  - attack.t1098
logsource:
  product: linux
  service: auth
detection:
  sel_created_uid0:
    layer_data.event: user_created
    layer_data.uid: 0
  sel_created_root_group:
    layer_data.event: user_created
    layer_data.gid:
      - 0
      - 27
  sel_modified_uid0:
    layer_data.event: user_modified
    layer_data.changed_attr: UID
    layer_data.uid: 0
  filter_root:
    layer_data.user: root
  condition: 1 of sel_* and not filter_root
fields:
  - pid
  - layer_data.program
  - layer_data.user
  - layer_data.uid
  - layer_data.gid
  - layer_data.old_value
  - layer_data.shell
falsepositives:
  - 거의 없음
level: critical
x_correlation: none          # required(필수) | recommended(권장) | none(단독 판정)
x_correlation_note: '단독 판정 가능'
x_seed_entity:
  - layer_data.user
  - pid