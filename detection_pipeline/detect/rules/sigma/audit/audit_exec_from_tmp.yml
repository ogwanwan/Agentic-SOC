# 막는 공격: 반입한 바이너리·스크립트를 /tmp, /var/tmp, /dev/shm 에서 실행 (채굴기, 리버스셸)
# 탐지 근거: execve exe 가 임시 경로로 시작 또는 인터프리터 바로 뒤에 임시 경로(sh /tmp/x.sh) + 비대화형. uid 제한 없음
# 주의: `< /tmp/file` 리다이렉션은 제외(9/14 07:34 mariadb 업그레이드 스크립트 오탐 반영). 합성 검증
title: Execution From Temporary Directory
id: 4f8b2d6a-9e3c-4a1f-b7d5-6c2e8a4f0d39
status: experimental
description: >
  /tmp, /var/tmp, /dev/shm 에 놓인 파일이 직접 실행되거나 인터프리터(sh, python, perl)로 실행됨.
  반입한 도구(채굴기, 리버스셸 바이너리)를 실행하는 전형적 위치.
author: 민혁
date: 2026-09-15
references:
  - https://attack.mitre.org/techniques/T1059/
logsource:
  product: linux
  service: auditd
detection:
  selection_exec:
    layer_data.syscall: execve
  selection_exe_path:
    layer_data.exe|startswith:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
  # 인터프리터 바로 뒤에 임시 경로가 오는 경우만 ("sh /tmp/x.sh"). `< /tmp/file` 같은 리다이렉션은 제외
  # (9/14 07:34 부팅 시 mariadb 업그레이드 스크립트가 `... < /tmp/sqltaHaSa` 로 걸렸던 오탐 반영)
  selection_interpreted:
    layer_data.exec_args|contains:
      - 'sh /tmp/'
      - 'sh /var/tmp/'
      - 'sh /dev/shm/'
      - 'bash /tmp/'
      - 'bash /var/tmp/'
      - 'bash /dev/shm/'
      - 'python /tmp/'
      - 'python3 /tmp/'
      - 'python3 /dev/shm/'
      - 'perl /tmp/'
      - 'php /tmp/'
      - 'php /dev/shm/'
  filter_interactive:
    layer_data.session_type: interactive
  condition: selection_exec and (selection_exe_path or selection_interpreted) and not filter_interactive
fields:
  - pid
  - ppid
  - layer_data.uid
  - layer_data.exe
  - layer_data.exec_args
falsepositives:
  - 패키지 설치기가 /tmp 에 푼 스크립트 실행 (실측 시 확인 필요)
level: high
tags:
  - attack.execution
  - attack.t1059
